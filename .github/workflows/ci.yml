name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test -- --run

  playwright:
    name: Playwright end-to-end tests
    if: github.event_name == 'push'
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: portal.pitell
    steps:
      - name: Check out frontend
        uses: actions/checkout@v5
        with:
          path: portal.pitell
          persist-credentials: false
      - name: Check out backend
        uses: actions/checkout@v5
        with:
          repository: adamkb33/pitell
          ref: main
          path: pitell
          ssh-key: ${{ secrets.PITELL_BACKEND_DEPLOY_KEY }}
          persist-credentials: false
      - name: Record tested commits
        run: |
          {
            echo "Frontend: $(git rev-parse HEAD)"
            echo "Backend: $(git -C ../pitell rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: portal.pitell/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: 'pitell/**/*.gradle.kts'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
